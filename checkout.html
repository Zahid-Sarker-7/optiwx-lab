<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!-- Optional: paste your Optimizely anti-flicker (hiding) snippet here, ABOVE the main snippet. -->

</head>
<body>
  <nav class="nav">
    <span class="brand">Aurora Goods</span>
    <a href="index.html">Home</a>
    <a href="product.html">Product</a>
    <a href="checkout.html">Checkout</a>
    <a href="spa.html">SPA</a>
    <a href="consent.html">Consent</a>
    <a href="fx.html">FX</a>
  </nav>

  <main class="container">
    <!-- Final step of the demo purchase flow. -->
    <section class="hero">
      <h1 id="checkout-title">Checkout</h1>
      <p>Review your order and complete your purchase.</p>
    </section>

    <section class="section">
      <h2>Order summary</h2>
      <p>1 × The Product — $49.99</p>

      <!-- Purchase button carrying a parseable order value. data-revenue is in
           dollars; data-revenue-cents is the same amount in cents (Optimizely
           revenue is typically tracked in cents). This is a demo — the button
           does not process a real payment. -->
      <button id="buy" class="btn btn-primary"
              data-revenue="49.99" data-revenue-cents="4999" data-currency="USD">
        Buy ($49.99)
      </button>
    </section>

    <div class="spacer" aria-hidden="true"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p id="footer-note">Footer note — below the fold.</p>
    </div>
  </footer>
