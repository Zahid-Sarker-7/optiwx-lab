<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Anti-flicker / hiding snippet placeholder: paste Optimizely's hiding snippet HERE, ABOVE the main snippet, to prevent FOOC. -->

  <!-- PASTE YOUR OPTIMIZELY WEB SNIPPET HERE (synchronous, in <head>): <script src="https://cdn.optimizely.com/js/PROJECT_ID.js"></script> -->

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav">
    <span class="brand">Optly Testbed</span>
    <a href="index.html">Home</a>
    <a href="product.html">Product</a>
    <a href="checkout.html">Checkout</a>
    <a href="spa.html">SPA</a>
    <a href="consent.html">Consent</a>
    <a href="fx.html">FX</a>
  </nav>

  <main class="container">
    <!-- REDIRECT EXPERIMENT TARGET.
         Point a Redirect experiment's variation at this page, e.g. redirect
         index.html -> redirect-target.html. This page verifies:
           1) the target resolves (no 404),
           2) UTM / query params survive the redirect (shown below),
           3) no redirect loop (this page must NOT redirect back to the source).
         Optimizely appends its own params; the runtime carries the original
         query string forward when "preserve query parameters" is enabled. -->
    <section class="hero">
      <h1 id="redirect-title">You landed on the redirect target</h1>
      <p>If UTMs/query params are preserved, they appear below.</p>
    </section>

    <section class="section">
      <h2>Query parameters received</h2>
      <!-- QA: assert utm_* keys survive; assert no infinite loop occurred. -->
      <pre id="qp">(none)</pre>
    </section>

    <div class="spacer" aria-hidden="true"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p id="footer-note">Footer note — below the fold.</p>
    </div>
  </footer>

  <script>
    // Render the incoming query string so UTM survival is observable.
    // NOTE: intentionally NO redirect away from here (prevents loops).
    (function () {
      var params = new URLSearchParams(location.search);
      var lines = [];
      params.forEach(function (v, k) { lines.push(k + ' = ' + v); });
      document.getElementById('qp').textContent = lines.length ? lines.join('\n') : '(none)';
    })();
  </script>
</body>
</html>
